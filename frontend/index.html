<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Primary SEO -->
    <title>GRCEye — Governance, Risk & Compliance Platform | Keep an Eye on Risk</title>
    <meta name="description" content="GRCEye is the all-in-one GRC SaaS platform: 70+ compliance frameworks, AI gap analysis, risk quantification, audits, policies, vendor risk and a public trust center — built for security teams." />

    <meta name="author" content="GRCEye" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="canonical" href="https://grceye.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GRCEye" />
    <meta property="og:title" content="GRCEye — Governance, Risk & Compliance Platform" />
    <meta property="og:description" content="The all-in-one GRC SaaS platform with 70+ frameworks, AI gap analysis, risk quantification, audits, policies and vendor risk." />
    <meta property="og:url" content="https://grceye.com/" />
    <meta property="og:image" content="https://grceye.com/logo.png" />
    <meta property="og:image:alt" content="GRCEye logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GRCEye — Governance, Risk & Compliance Platform" />
    <meta name="twitter:description" content="The all-in-one GRC SaaS platform with 70+ frameworks, AI gap analysis, risk quantification, audits, policies and vendor risk." />
    <meta name="twitter:image" content="https://grceye.com/logo.png" />

      "name": "GRCEye",
      "url": "https://grceye.com",
      "logo": "https://grceye.com/logo.png",
      "description": "All-in-one Governance, Risk and Compliance SaaS platform.",
      "sameAs": [],
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "contactType": "sales",

        {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@grceye.io",
          "availableLanguage": ["en", "fr"]
        }
      ]

    <!-- WebSite JSON-LD with sitelinks search -->

      "@context": "https://schema.org",
