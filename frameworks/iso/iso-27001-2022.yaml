framework:
  name: "ISO/IEC 27001:2022 — Information Security Management System"
  short_name: "ISO27001"
  version: "2022"
  description: >
    ISO/IEC 27001:2022 is the international standard for Information Security Management Systems (ISMS).
    It specifies the requirements for establishing, implementing, maintaining and continually improving
    an information security management system within the context of the organization.
  issuing_body: "International Organization for Standardization (ISO) / International Electrotechnical Commission (IEC)"
  applicable_regions:
    - global
  applicable_industries:
    - all

controls:
  # ────────────────────────────────────────────────────
  # Clause 4 — Context of the organization
  # ────────────────────────────────────────────────────
  - id: "4.1"
    title: "Understanding the organization and its context"
    description: "Determine external and internal issues relevant to the organization's purpose and affecting its ability to achieve the intended outcomes of its ISMS."
    category: "organizational"
    tags: ["context", "isms-scope"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.OC-01"
      - framework: "SOC2"
        control: "CC1.1"
    requirements:
      - text: "Organization shall determine external and internal issues relevant to its purpose."
        level: "must"

  - id: "4.2"
    title: "Understanding the needs and expectations of interested parties"
    description: "Determine interested parties and their requirements relevant to information security."
    category: "organizational"
    tags: ["stakeholders", "requirements"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.OC-02"

  - id: "4.3"
    title: "Determining the scope of the information security management system"
    description: "Determine boundaries and applicability of the ISMS to establish its scope."
    category: "organizational"
    tags: ["isms-scope"]

  - id: "4.4"
    title: "Information security management system"
    description: "Establish, implement, maintain and continually improve an ISMS."
    category: "organizational"
    tags: ["isms"]

  # ────────────────────────────────────────────────────
  # Clause 5 — Leadership
  # ────────────────────────────────────────────────────
  - id: "5.1"
    title: "Leadership and commitment"
    description: "Top management shall demonstrate leadership and commitment with respect to the ISMS."
    category: "organizational"
    tags: ["leadership", "management"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.RR-01"
      - framework: "SOC2"
        control: "CC1.4"

  - id: "5.2"
    title: "Policy"
    description: "Top management shall establish an information security policy."
    category: "organizational"
    tags: ["policy", "leadership"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.PO-01"
      - framework: "SOC2"
        control: "CC1.3"
      - framework: "NIST_800_53"
        control: "PM-1"
    requirements:
      - text: "Information security policy shall be appropriate to the purpose of the organization."
        level: "must"
      - text: "Policy shall include commitment to satisfying applicable requirements."
        level: "must"
      - text: "Policy shall include commitment to continual improvement of the ISMS."
        level: "must"

  - id: "5.3"
    title: "Organizational roles, responsibilities and authorities"
    description: "Top management shall ensure that responsibilities and authorities for relevant roles are assigned and communicated."
    category: "organizational"
    tags: ["roles", "responsibilities"]

  # ────────────────────────────────────────────────────
  # Clause 6 — Planning
  # ────────────────────────────────────────────────────
  - id: "6.1"
    title: "Actions to address risks and opportunities"
    description: "Determine risks and opportunities that need to be addressed to ensure the ISMS can achieve its intended outcomes."
    category: "organizational"
    tags: ["risk", "planning"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.RM-01"
      - framework: "SOC2"
        control: "CC3.1"

  - id: "6.1.2"
    title: "Information security risk assessment"
    description: "Apply risk assessment processes to identify, analyze and evaluate information security risks."
    category: "organizational"
    tags: ["risk-assessment"]
    parent_id: "6.1"
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "ID.RA-01"
      - framework: "SOC2"
        control: "CC3.2"
      - framework: "NIST_800_53"
        control: "RA-3"
    requirements:
      - text: "Risk assessment shall produce consistent, valid and comparable results."
        level: "must"
      - text: "Risk criteria including risk acceptance criteria shall be defined."
        level: "must"

  - id: "6.1.3"
    title: "Information security risk treatment"
    description: "Select appropriate risk treatment options considering risk assessment results."
    category: "organizational"
    tags: ["risk-treatment"]
    parent_id: "6.1"
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.RM-06"
      - framework: "SOC2"
        control: "CC3.4"
      - framework: "NIST_800_53"
        control: "RA-3"

  - id: "6.2"
    title: "Information security objectives and planning to achieve them"
    description: "Establish information security objectives at relevant functions and levels."
    category: "organizational"
    tags: ["objectives", "planning"]

  # ────────────────────────────────────────────────────
  # Annex A Controls (2022 edition — 93 controls, 4 themes)
  # Theme 1: Organizational (37 controls)
  # ────────────────────────────────────────────────────
  - id: "A.5.1"
    title: "Policies for information security"
    description: "An information security policy and topic-specific policies shall be defined, approved by management, published, communicated to and acknowledged by relevant personnel."
    category: "organizational"
    tags: ["policy", "annex-a", "theme-organizational"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.PO-01"
      - framework: "SOC2"
        control: "CC1.3"
      - framework: "NIST_800_53"
        control: "PM-1"
      - framework: "CIS8"
        control: "17"
    requirements:
      - text: "Information security policies shall be reviewed at planned intervals or if significant changes occur."
        level: "must"

  - id: "A.5.2"
    title: "Information security roles and responsibilities"
    description: "Information security responsibilities shall be defined and allocated according to the organization's needs."
    category: "organizational"
    tags: ["roles", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.RR-02"
      - framework: "SOC2"
        control: "CC1.4"
      - framework: "NIST_800_53"
        control: "PM-2"

  - id: "A.5.3"
    title: "Segregation of duties"
    description: "Conflicting duties and areas of responsibility shall be segregated."
    category: "organizational"
    tags: ["access-control", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.AA-05"
      - framework: "SOC2"
        control: "CC6.3"
      - framework: "NIST_800_53"
        control: "AC-5"

  - id: "A.5.7"
    title: "Threat intelligence"
    description: "Information relating to information security threats shall be collected and analysed to produce threat intelligence."
    category: "organizational"
    tags: ["threat-intelligence", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "ID.RA-02"
      - framework: "NIST_800_53"
        control: "SI-5"

  - id: "A.5.14"
    title: "Information transfer"
    description: "Information transfer rules, procedures and controls shall be implemented for all types of transfer."
    category: "organizational"
    tags: ["data-transfer", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.DS-02"
      - framework: "NIST_800_53"
        control: "SC-8"

  - id: "A.5.15"
    title: "Access control"
    description: "Rules to control physical and logical access to information and assets shall be established and implemented."
    category: "technical"
    tags: ["access-control", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.AA-01"
      - framework: "SOC2"
        control: "CC6.1"
      - framework: "NIST_800_53"
        control: "AC-1"
      - framework: "PCI_DSS4"
        control: "7.1"

  - id: "A.5.16"
    title: "Identity management"
    description: "The full life cycle of identities shall be managed."
    category: "technical"
    tags: ["identity", "access-control", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.AA-02"
      - framework: "SOC2"
        control: "CC6.2"
      - framework: "NIST_800_53"
        control: "IA-1"
      - framework: "PCI_DSS4"
        control: "8.1"

  - id: "A.5.17"
    title: "Authentication information"
    description: "Allocation and management of authentication information shall be controlled by a management process."
    category: "technical"
    tags: ["authentication", "passwords", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.AA-03"
      - framework: "SOC2"
        control: "CC6.1"
      - framework: "NIST_800_53"
        control: "IA-5"
      - framework: "PCI_DSS4"
        control: "8.3"
    requirements:
      - text: "Passwords shall meet minimum complexity requirements."
        level: "must"
      - text: "Multi-factor authentication shall be used for privileged accounts."
        level: "must"

  - id: "A.5.23"
    title: "Information security for use of cloud services"
    description: "Processes for acquisition, use, management and exit from cloud services shall be established."
    category: "organizational"
    tags: ["cloud", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "GV.SC-06"
      - framework: "CSA_CCM"
        control: "AIS-01"

  - id: "A.5.28"
    title: "Collection of evidence"
    description: "The organisation shall establish and implement procedures for identification, collection, acquisition and preservation of evidence."
    category: "organizational"
    tags: ["incident-response", "forensics", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "RS.AN-03"
      - framework: "NIST_800_53"
        control: "IR-4"

  - id: "A.5.29"
    title: "Information security during disruption"
    description: "The organization shall plan how to maintain information security at an appropriate level during disruption."
    category: "organizational"
    tags: ["business-continuity", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "RC.RP-01"
      - framework: "NIST_800_53"
        control: "CP-10"

  # Theme 2: People (8 controls)
  - id: "A.6.1"
    title: "Screening"
    description: "Background verification checks on all candidates for employment shall be carried out."
    category: "organizational"
    tags: ["hr", "personnel", "annex-a", "theme-people"]
    mapped_controls:
      - framework: "SOC2"
        control: "CC1.4"
      - framework: "NIST_800_53"
        control: "PS-3"

  - id: "A.6.3"
    title: "Information security awareness, education and training"
    description: "Personnel and relevant interested parties shall receive appropriate awareness education and training."
    category: "organizational"
    tags: ["training", "awareness", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.AT-01"
      - framework: "SOC2"
        control: "CC1.4"
      - framework: "NIST_800_53"
        control: "AT-2"
      - framework: "CIS8"
        control: "14"

  - id: "A.6.8"
    title: "Information security event reporting"
    description: "Personnel shall be required to report observed or suspected information security events through appropriate mechanisms."
    category: "organizational"
    tags: ["incident-reporting", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "DE.AE-05"
      - framework: "NIST_800_53"
        control: "IR-6"

  # Theme 3: Physical (14 controls)
  - id: "A.7.1"
    title: "Physical security perimeters"
    description: "Security perimeters shall be defined and used to protect areas that contain information and other associated assets."
    category: "physical"
    tags: ["physical-security", "annex-a", "theme-physical"]
    mapped_controls:
      - framework: "NIST_800_53"
        control: "PE-3"
      - framework: "SOC2"
        control: "CC6.4"

  - id: "A.7.4"
    title: "Physical security monitoring"
    description: "Premises shall be continuously monitored for unauthorized physical access."
    category: "physical"
    tags: ["physical-security", "monitoring", "annex-a"]
    mapped_controls:
      - framework: "NIST_800_53"
        control: "PE-6"

  # Theme 4: Technological (34 controls)
  - id: "A.8.1"
    title: "User endpoint devices"
    description: "Information stored on, processed by or accessible via user endpoint devices shall be protected."
    category: "technical"
    tags: ["endpoint", "annex-a", "theme-technological"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.PS-01"
      - framework: "NIST_800_53"
        control: "CM-6"
      - framework: "CIS8"
        control: "4"

  - id: "A.8.2"
    title: "Privileged access rights"
    description: "Allocation and use of privileged access rights shall be restricted and managed."
    category: "technical"
    tags: ["privileged-access", "access-control", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.AA-05"
      - framework: "SOC2"
        control: "CC6.3"
      - framework: "NIST_800_53"
        control: "AC-6"
      - framework: "CIS8"
        control: "5"
      - framework: "PCI_DSS4"
        control: "7.2"
    requirements:
      - text: "Privileged access rights shall be reviewed at regular intervals."
        level: "must"
      - text: "Privileged user accounts shall be used only for administrative activities."
        level: "must"

  - id: "A.8.3"
    title: "Information access restriction"
    description: "Access to information and application functions shall be restricted."
    category: "technical"
    tags: ["access-control", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.AA-01"
      - framework: "SOC2"
        control: "CC6.1"
      - framework: "NIST_800_53"
        control: "AC-3"

  - id: "A.8.4"
    title: "Access to source code"
    description: "Read and write access to source code, development tools and software libraries shall be appropriately managed."
    category: "technical"
    tags: ["source-code", "access-control", "annex-a"]
    mapped_controls:
      - framework: "SOC2"
        control: "CC8.1"
      - framework: "NIST_800_53"
        control: "CM-5"

  - id: "A.8.7"
    title: "Protection against malware"
    description: "Protection against malware shall be implemented and supported by appropriate user awareness."
    category: "technical"
    tags: ["malware", "endpoint-security", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "DE.CM-09"
      - framework: "SOC2"
        control: "CC6.8"
      - framework: "NIST_800_53"
        control: "SI-3"
      - framework: "CIS8"
        control: "10"

  - id: "A.8.8"
    title: "Management of technical vulnerabilities"
    description: "Information about technical vulnerabilities of information systems shall be obtained in a timely fashion."
    category: "technical"
    tags: ["vulnerability-management", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "ID.RA-01"
      - framework: "SOC2"
        control: "CC7.1"
      - framework: "NIST_800_53"
        control: "SI-2"
      - framework: "CIS8"
        control: "7"
      - framework: "PCI_DSS4"
        control: "6.3"
    requirements:
      - text: "Vulnerability scanning shall be performed regularly."
        level: "must"
      - text: "Patches shall be applied in a timely manner."
        level: "must"

  - id: "A.8.9"
    title: "Configuration management"
    description: "Configurations, including security configurations, of hardware, software, services and networks shall be established, documented, implemented, monitored and reviewed."
    category: "technical"
    tags: ["configuration-management", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.PS-01"
      - framework: "SOC2"
        control: "CC7.1"
      - framework: "NIST_800_53"
        control: "CM-6"
      - framework: "CIS8"
        control: "4"

  - id: "A.8.10"
    title: "Information deletion"
    description: "Information stored in information systems, devices or in any other storage media shall be deleted when no longer required."
    category: "technical"
    tags: ["data-retention", "data-deletion", "annex-a"]
    mapped_controls:
      - framework: "NIST_800_53"
        control: "MP-6"
      - framework: "GDPR"
        control: "Art.17"

  - id: "A.8.12"
    title: "Data leakage prevention"
    description: "Data leakage prevention measures shall be applied to systems, networks and any other devices that process, store or transmit sensitive information."
    category: "technical"
    tags: ["dlp", "data-protection", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.DS-10"
      - framework: "NIST_800_53"
        control: "AC-4"

  - id: "A.8.15"
    title: "Logging"
    description: "Logs that record activities, exceptions, faults and other relevant events shall be produced, stored, protected and analysed."
    category: "technical"
    tags: ["logging", "monitoring", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "DE.CM-03"
      - framework: "SOC2"
        control: "CC7.2"
      - framework: "NIST_800_53"
        control: "AU-2"
      - framework: "CIS8"
        control: "8"
      - framework: "PCI_DSS4"
        control: "10.2"
    requirements:
      - text: "Logs shall be retained for a minimum period to support investigations."
        level: "must"
      - text: "Log integrity shall be protected."
        level: "must"

  - id: "A.8.16"
    title: "Monitoring activities"
    description: "Networks, systems and applications shall be monitored for anomalous behaviour and appropriate actions taken to evaluate potential information security incidents."
    category: "technical"
    tags: ["monitoring", "siem", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "DE.CM-01"
      - framework: "SOC2"
        control: "CC7.2"
      - framework: "NIST_800_53"
        control: "SI-4"

  - id: "A.8.23"
    title: "Web filtering"
    description: "Access to external websites shall be managed to reduce exposure to malicious content."
    category: "technical"
    tags: ["web-filtering", "annex-a"]
    mapped_controls:
      - framework: "NIST_800_53"
        control: "SC-18"
      - framework: "CIS8"
        control: "9"

  - id: "A.8.24"
    title: "Use of cryptography"
    description: "Rules for the effective use of cryptography, including cryptographic key management, shall be defined and implemented."
    category: "technical"
    tags: ["cryptography", "encryption", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.DS-01"
      - framework: "SOC2"
        control: "CC6.1"
      - framework: "NIST_800_53"
        control: "SC-28"
      - framework: "PCI_DSS4"
        control: "3.5"
    requirements:
      - text: "Encryption shall be used for sensitive data at rest and in transit."
        level: "must"
      - text: "Cryptographic key management procedures shall be established."
        level: "must"

  - id: "A.8.25"
    title: "Secure development life cycle"
    description: "Rules for the secure development of software and systems shall be established and applied."
    category: "technical"
    tags: ["ssdlc", "development", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.PS-04"
      - framework: "SOC2"
        control: "CC8.1"
      - framework: "NIST_800_53"
        control: "SA-15"
      - framework: "OWASP_ASVS"
        control: "V1.1"

  - id: "A.8.28"
    title: "Secure coding"
    description: "Secure coding principles shall be applied to software development."
    category: "technical"
    tags: ["secure-coding", "development", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.PS-04"
      - framework: "OWASP_ASVS"
        control: "V5.1"
      - framework: "CIS8"
        control: "16"

  - id: "A.8.32"
    title: "Change management"
    description: "Changes to information processing facilities and information systems shall be subject to change management procedures."
    category: "technical"
    tags: ["change-management", "annex-a"]
    mapped_controls:
      - framework: "NIST_CSF2"
        control: "PR.PS-03"
      - framework: "SOC2"
        control: "CC8.1"
      - framework: "NIST_800_53"
        control: "CM-3"

  - id: "A.8.33"
    title: "Test information"
    description: "Test information shall be appropriately selected, protected and managed."
    category: "technical"
    tags: ["testing", "data-protection", "annex-a"]
    mapped_controls:
      - framework: "NIST_800_53"
        control: "SA-15"

  - id: "A.8.34"
    title: "Protection of information systems during audit testing"
    description: "Audit tests and other assurance activities involving assessment of operational systems shall be planned and agreed between the tester and appropriate management."
    category: "technical"
    tags: ["audit", "testing", "annex-a"]
    mapped_controls:
      - framework: "NIST_800_53"
        control: "CA-7"
