# Loopback (Ventoy) menu for the OFFLINE appliance installer ISO.
#
# timeout=-1 waits indefinitely and is a safety control, not a preference. The
# first entry erases the target disk without asking again, because the
# "autoinstall" kernel argument deliberately suppresses subiquity's own
# confirmation. With a finite timeout, an ISO left in iDRAC/iLO virtual media or
# a USB stick left in a front panel would re-wipe the machine on every reboot
# with nobody touching it.
#
# The semicolon in ds=nocloud;s=... is escaped because GRUB otherwise reads it as
# a command separator and the kernel receives a truncated "ds=nocloud" that
# resolves to no seed at all.

set timeout=-1
set default=0

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Install the appliance (ERASES ALL DATA ON THIS MACHINE)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ iso-scan/filename=${iso_path} fsck.mode=skip ---
	initrd	/casper/initrd
}
menuentry "Recovery: stock Ubuntu installer, manual partitioning" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  ---
	initrd	/casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
else
menuentry 'Test memory' {
	linux16 /boot/memtest86+x64.bin
}
fi
