server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    # "http2 on;" as its own directive is nginx 1.25 and later. Ubuntu 24.04
    # ships nginx 1.24, which only knows http2 as a listen parameter and refuses
    # to start at all on the newer form:
    #     [emerg] unknown directive "http2"
    # The listen parameter form is deprecated in 1.25 but still honoured there,
    # so this spelling works on both.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    ssl_certificate     /etc/appliance/tls/tls.crt;
    ssl_certificate_key /etc/appliance/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/snippets/appliance-security-headers.conf;

    server_tokens off;
    client_max_body_size 48m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /var/www/appliance;
    index index.html;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/appliance-security-headers.conf;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location /api/ {
        # The FastAPI backend listens on 8000 (APP_PORT in /etc/appliance/app.env).
        # The scaffold pointed at 3000, which is the Node default it was written
        # for and nothing at all on this appliance.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # Single page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/appliance-security-headers.conf;
    }
}
