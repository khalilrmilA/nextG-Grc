# Security headers, kept in one place and included wherever they are needed.
#
# This exists because of an nginx rule that is easy to get wrong: add_header is
# NOT inherited into a location block that declares any add_header of its own.
# The previous config set these five in the server block, then used
# "add_header Cache-Control ..." inside "location /" and "location /assets/".
# The effect was that the dashboard and every one of its assets were served with
# NONE of these headers, while /api/ and /health, which declare no add_header,
# got all of them. Verified against a running appliance: the HTML response
# carried no Strict-Transport-Security, no CSP and no X-Frame-Options.
#
# So: include this file in the server block AND in every location that sets any
# header of its own. If you add a location with an add_header, add the include
# too.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
