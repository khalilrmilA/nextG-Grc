[tool.poetry]
name = "grc-platform-backend"
version = "0.1.0"
description = "GRC SaaS Platform - Backend API"
authors = ["GRC Platform Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.141.1,<1.0.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
alembic = "^1.14.0"
asyncpg = "^0.30.0"
pydantic = {extras = ["email"], version = "^2.10.0"}
pydantic-settings = ">=2.14.2,<3.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = ">=0.0.31"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = {extras = ["hiredis"], version = "^5.2.0"}
boto3 = "^1.35.0"
httpx = "^0.28.0"
pyyaml = "^6.0.2"
Pillow = ">=12.3.0,<13.0.0"
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
reportlab = "^4.2.5"
anthropic = "^0.40.0"
pgvector = "^0.3.6"
stripe = "^11.2.0"
tenacity = "^9.0.0"
structlog = "^24.4.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.19.0"}
aiosmtplib = ">=5.1.2,<6.0.0"
pypdf = ">=6.16.1,<7.0.0"
starlette = ">=1.3.1"
cryptography = ">=50.0.0"
PyJWT = ">=2.13.0"
jinja2 = "^3.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
factory-boy = "^3.3.0"
faker = "^33.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
