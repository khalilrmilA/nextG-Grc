# Boot menu used when this ISO is booted from a loopback loader (Ventoy, GRUB
# "loopback" on a multi-boot stick, some iLO/iDRAC modes) rather than written to
# the medium directly.
#
# This file has to exist and has to be replaced. The stock Ubuntu loopback.cfg
# carries no autoinstall argument at all, so a Ventoy boot of our ISO silently
# bypasses our menu entirely and drops the operator into the plain interactive
# Ubuntu installer. That is not destructive, but it is not the product either:
# they get Ubuntu, not the appliance, and nothing says why.
#
# The difference from grub.cfg is iso-scan/filename. Under a loopback loader the
# kernel has to be told which file on which partition to find the rest of the
# image in; ${iso_path} is set by the loader.
#
# timeout=-1 for the same reason as grub.cfg: the first entry erases the target
# disk without asking, so a human has to choose it. Never give this a finite
# timeout.

set timeout=-1
set default=0

menuentry "Install the appliance (ERASES ALL DATA ON THIS MACHINE)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ iso-scan/filename=${iso_path} ---
	initrd	/casper/initrd
}
menuentry "Install the appliance, HWE kernel (ERASES ALL DATA)" {
	set gfxpayload=keep
	linux	/casper/hwe-vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ iso-scan/filename=${iso_path} ---
	initrd	/casper/hwe-initrd
}
menuentry "Recovery: stock Ubuntu installer, manual partitioning" {
	set gfxpayload=keep
	linux	/casper/vmlinuz iso-scan/filename=${iso_path} ---
	initrd	/casper/initrd
}
