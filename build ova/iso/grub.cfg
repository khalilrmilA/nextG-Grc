# Boot menu for the appliance installer ISO.
#
# Replaces Ubuntu's stock menu. Two things differ from the original and both
# matter:
#
#   1. "autoinstall" on the kernel command line. Without it subiquity stops and
#      asks the operator to confirm before it touches the disks, which defeats
#      the point of an unattended installer. With it, the confirmation is
#      suppressed, so the first entry MUST say plainly that it erases the disk.
#
#   2. ds=nocloud;s=/cdrom/nocloud/ points cloud-init at the seed directory
#      added to this ISO. The semicolon is escaped as \; because GRUB otherwise
#      reads it as a command separator and the kernel would receive a truncated
#      "ds=nocloud" that resolves to no seed at all.
#
# The recovery entry at the bottom is the stock Ubuntu installer with no
# autoinstall. It is the way back in when a machine needs manual partitioning.

# timeout=-1 means wait indefinitely for a keypress, and it is a safety control,
# not a preference. Entry 0 erases the target disk without asking again, because
# the autoinstall kernel argument deliberately suppresses subiquity's own
# confirmation. With a finite timeout, an ISO left attached in iDRAC/iLO virtual
# media, or a USB stick left in a front panel, re-wipes the machine on EVERY
# subsequent reboot with nobody touching it. A human has to choose to install.
set timeout=-1
set default=0

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Install the appliance (ERASES ALL DATA ON THIS MACHINE)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/  ---
	initrd	/casper/initrd
}
menuentry "Install the appliance, HWE kernel (ERASES ALL DATA)" {
	set gfxpayload=keep
	linux	/casper/hwe-vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/  ---
	initrd	/casper/hwe-initrd
}
menuentry "Recovery: stock Ubuntu installer, manual partitioning" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  ---
	initrd	/casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
else
menuentry 'Test memory' {
	linux16 /boot/memtest86+x64.bin
}
fi
