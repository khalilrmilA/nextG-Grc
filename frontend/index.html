<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Primary SEO -->
    <title>GRC Eye — Governance, Risk & Compliance Platform | Keep an Eye on Risk</title>
    <meta name="description" content="GRC Eye is the all-in-one GRC SaaS platform: 70+ compliance frameworks, AI gap analysis, risk quantification, audits, policies, vendor risk and a public trust center — built for security teams." />

    <meta name="author" content="GRC Eye" />
    <!-- Private authenticated app shell: never index it, and never let it assert
         brand entity data. The marketing site (Next.js) is the sole source of the
         GRC Eye Organization/WebSite entity; a second, differing copy here split the
         brand across two conflicting knowledge-graph nodes. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0F74C5" />
    

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GRC Eye" />
    <meta property="og:title" content="GRC Eye — Governance, Risk & Compliance Platform" />
    <meta property="og:description" content="The all-in-one GRC SaaS platform with 70+ frameworks, AI gap analysis, risk quantification, audits, policies and vendor risk." />
    <meta property="og:url" content="https://grceye.com/" />
    <meta property="og:image" content="https://grceye.com/logo.png" />
    <meta property="og:image:alt" content="GRC Eye logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GRC Eye — Governance, Risk & Compliance Platform" />
    <meta name="twitter:description" content="The all-in-one GRC SaaS platform with 70+ frameworks, AI gap analysis, risk quantification, audits, policies and vendor risk." />
    <meta name="twitter:image" content="https://grceye.com/logo.png" />


  </head>
