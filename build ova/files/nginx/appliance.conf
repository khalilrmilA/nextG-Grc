# The appliance serves its web console over plain HTTP on port 80.
#
# HTTPS was tried first and removed deliberately. A self-signed certificate meant
# a browser warning for every user on every deployment, and the certificate was
# generated at first boot from the machine's own address: a machine with no
# address produced no certificate, nginx refused to start, and the appliance
# served nothing at all. That is not a hypothetical, it is what happened on an
# offline install.
#
# WHAT THIS COSTS: traffic between the browser and the appliance is not
# encrypted. That is a reasonable trade on a trusted internal network and is NOT
# suitable across the public internet. To put TLS back, restore the ssl_ lines
# kept at the bottom of this file and change the listen directives.
#
# The backend still listens on 127.0.0.1 only, so nginx remains the only way in.
server {
    listen 80 default_server;
    listen [::]:80 default_server;


    server_tokens off;
    client_max_body_size 48m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /var/www/appliance;
    index index.html;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/appliance-security-headers.conf;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location /api/ {
        # The FastAPI backend listens on 8000 (APP_PORT in /etc/appliance/app.env).
        # The scaffold pointed at 3000, which is the Node default it was written
        # for and nothing at all on this appliance.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # Single page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/appliance-security-headers.conf;
    }
}
